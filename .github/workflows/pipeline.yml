name: "Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # At the end of every day
    - cron:  '0 0 * * *'
  workflow_dispatch: # Enables manual triggers

concurrency:
  group: common-js-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16.14

      - name: Get yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/node_modules
            ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-deps-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test

      - name: Disable dry-run
        if: (endsWith(github.ref, '/main') && github.event_name == 'push') || github.event_name == 'schedule'
        run: echo "DISABLE_DRY_RUN=true" >> $GITHUB_ENV

      - name: Set NPM auth token
        if: (endsWith(github.ref, '/main') && github.event_name == 'push') || github.event_name == 'schedule'
        run: npm config set //registry.npmjs.org/:_authToken="${{ secrets.NPM_AUTH_TOKEN }}"

      - name: Publish
        run: yarn start

  keepalive:
    name: Keep scheduled workflows active
    if: ${{ github.event_name == 'schedule' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record repository activity
        env:
          # main is protected, so keep automated commits on a dedicated branch.
          KEEPALIVE_BRANCH: github-actions/keepalive
        run: |
          if git ls-remote --exit-code --heads origin "$KEEPALIVE_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$KEEPALIVE_BRANCH"
            git checkout --detach FETCH_HEAD
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty --message "chore: keep scheduled workflows active"
          git push origin "HEAD:refs/heads/$KEEPALIVE_BRANCH"
